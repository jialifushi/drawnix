services:
  drawnix:
        build:
      context: .
      args:
        ALLOW_CODE: code # Directly set the build argument here
    container_name: drawnix            # 容器名称为 drawnix
    ports:
      - "8033:80"                      # 将主机的 8033 端口映射到容器的 80 端口（左侧可自行修改）
    restart: always                    # 容器异常退出时自动重启
    environment:
        - ALLOW_CODE=hertz # 访问码，用户输入此码即可登录
